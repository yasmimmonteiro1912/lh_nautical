name: 'lh_nautical_dbt'
version: '1.0.0'
config-version: 2

# IMPORTANTE: Esse nome deve ser o mesmo que está no seu ~/.dbt/profiles.yml
profile: 'lh_nautical_dbt'

# Caminhos das pastas estruturais do seu projeto
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Arquivos que serão limpos quando você rodar o comando 'dbt clean'
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# ===================================================================
# CONFIGURAÇÃO DOS MODELOS (Aplicando DRY e boas práticas Databricks)
# ===================================================================
models:
  lh_nautical_dbt:
    # Configuração Global para o Databricks: Tudo nasce como tabela Delta por padrão
    +file_format: delta
    
    # Camada Staging (Seus dados limpos vindos da ingestão bronze)
    # DRY: Definimos que tudo dentro de staging vira VIEW automaticamente.
    # Evita que você precise escrever {{ config(materialized='view') }} em todos os arquivos!
    staging:
      +materialized: view
      
    # Camada Marts (Onde ficarão seus Fatos e Dimensões prontos para o negócio)
    # DRY: Tudo aqui dentro vira TABELA Delta otimizada de forma automática.
    marts:
      +materialized: table