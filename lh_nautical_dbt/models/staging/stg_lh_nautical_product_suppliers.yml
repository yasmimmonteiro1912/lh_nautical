version: 2

models:
  - name: stg_lh_nautical_product_suppliers
    description: "Tabela de junção que mapeia o relacionamento entre variantes de produtos e seus fornecedores. Por ser uma tabela de relacionamento N:N, a combinação de Produto + Fornecedor deve ser única para evitar duplicados."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_variant_id
            - supplier_id
    
    columns:
      - name: product_variant_id
        description: "Parte da chave composta identificando a variante do produto."
        tests:
          - not_null

      - name: supplier_id
        description: "Parte da chave composta identificando o fornecedor."
        tests:
          - not_null

      - name: supplier_sku
        description: "Sanitized supplier SKU code. Placeholders ('?', 'sem-codigo', 'tbd') and empty strings are cast to NULL; valid codes are normalized to UPPERCASE."

      - name: last_quoted_cost
        description: "Último custo cotado ou cobrado por esse fornecedor."

      - name: lead_time_days
        description: "Tempo médio em dias para entrega do produto por este fornecedor."

      - name: is_preferred
        description: "Indicador se este é o fornecedor principal para essa variante."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              config:
                severity: warn

      - name: created_at
        description: "Data de criação do vínculo."
        tests:
          - not_null

      - name: updated_at
        description: "Data de alteração do vínculo."
        tests:
          - not_null
      
      - name: ingestion_timestamp
        description: "Carimbo de data/hora que registra o momento exato da ingestão do dado bruto na camada Bronze."
        tests:
          - not_null
          