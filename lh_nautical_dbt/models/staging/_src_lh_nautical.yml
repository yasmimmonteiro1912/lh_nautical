version: 2

sources:
  - name: lh_nautical
    database: workspace # Definido apenas uma vez (DRY)
    schema: bronze      # Definido apenas uma vez (DRY)
    tables:
      - name: addresses
        description: "Endereços físicos dos clientes."

      - name: attributes
        description: "Metadados de propriedades técnicas dinâmicas (Ex: Potência, Comprimento, Tamanho)."

      - name: brands
        description: "Fabricantes e marcas dos produtos do catálogo."

      - name: categories
        description: "Taxonomia de categorias e subcategorias de produtos."

      - name: customers
        description: "Cadastro consolidado de clientes ativos e inativos."

      - name: employees
        description: "Cadastro de funcionários, vendedores e gerentes."

      - name: fiscal_invoices
        description: "Notas fiscais (NF-e) geradas na venda para conformidade fiscal."

      - name: goods_receipt_items
        description: "Itens individuais descarregados no CD (Nota: contém erro ortográfico da origem)."

      - name: goods_receipts
        description: "Documento de cabeçalho de recebimento físico de cargas de fornecedores."

      - name: locations
        description: "Filiais, galpões de distribuição, lojas físicas e e-commerce."

      - name: order_items
        description: "Itens individuais vinculados aos pedidos de venda."

      - name: orders
        description: "Pedidos de venda gerados nos canais POS e E-commerce."

      - name: payments
        description: "Métodos e parcelamentos de pagamentos efetuados nos pedidos."

      - name: product_suppliers
        description: "Associação relacional entre os produtos e seus respectivos fornecedores."

      - name: product_variants
        description: "Variações específicas de cada produto (SKU, Cor, Voltagem)."

      - name: products
        description: "Catálogo mestre dos produtos comercializados."

      - name: purchase_order_items
        description: "Itens individuais solicitados em ordens de compra para os fornecedores."

      - name: purchase_orders
        description: "Ordens de compra enviadas para reposição de estoque junto a fornecedores."

      - name: return_items
        description: "Produtos devolvidos pelos clientes com motivos de devolução."

      - name: returns
        description: "Controle de cabeçalhos de logística reversa e devoluções."

      - name: stock_levels
        description: "Status atual de quantidade disponível física em estoque (atualização destrutiva)."

      - name: stock_movements
        description: "Histórico de transações de entrada, saída e ajustes de inventário."

      - name: suppliers
        description: "Fornecedores homologados de peças, motores e coletes."

      - name: variant_attribute_values
        description: "Valores reais atribuídos para cada combinação de variante de produto e atributo."
      - name: taxas_cambio
        description: "Tabela bruta contendo as cotações unificadas do Dólar e Euro vindas da API do Bacen."