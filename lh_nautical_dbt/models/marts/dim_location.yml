version: 2

# Column mappings and quality data tests
models:
  - name: dim_location
    description: "Gold dimension model for physical locations derived from CEP and address enrichment logic."
    columns:
      - name: location_sk
        description: "Surrogate key generated from the location_id. Primary key for star schema joins."
        data_tests:
          - unique
          - not_null

      - name: location_id
        description: "Natural business key identifying the location."
        data_tests:
          - unique
          - not_null

      - name: location_name
        description: "Business name of the location."

      - name: location_type
        description: "Type of location such as warehouse, store, office, or branch."

      - name: postal_code
        description: "Formatted postal code (CEP) associated with the location."

      - name: street
        description: "Street name of the location address."

      - name: location_number
        description: "Street number of the location address."

      - name: complement
        description: "Address complement, if applicable."

      - name: district
        description: "Neighborhood or district of the location address."

      - name: city
        description: "City name associated with the location."

      - name: location_state
        description: "State abbreviation associated with the location."

      - name: country
        description: "Country associated with the location."

      - name: is_active
        description: "Flag indicating whether the location is active."

      - name: has_complete_geography
        description: "Flag indicating whether the location has a complete geographical address."

      - name: is_valid_postal_code
        description: "Flag indicating whether the postal code is considered valid."
