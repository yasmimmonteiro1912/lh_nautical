version: 2

models:
  - name: dim_employee
    description: "Dimensão Colaborador contendo o perfil de RH, cargo e contexto operacional/geográfico da filial de trabalho."
    columns:
      - name: employee_sk
        description: "Primary surrogate key generated via dbt_utils hash of employee_id."
        tests:
          - unique
          - not_null

      - name: employee_id
        description: "Chave primária natural do colaborador oriunda do sistema transacional."
        tests:
          - unique
          - not_null

      - name: employee_full_name
        description: "Nome completo do colaborador."
        tests:
          - not_null

      - name: employee_cpf
        description: "CPF do colaborador para fins de auditoria e compliance."
        tests:
          - not_null

      - name: employee_email
        description: "E-mail corporativo utilizado para mapeamento e controle de acessos (RLS)."

      - name: employee_role
        description: "Cargo operacional do colaborador (salesperson, stockist, buyer, manager, admin)."
        tests:
          - not_null

      - name: hire_date
        description: "Data formal de contratação do funcionário."
        tests:
          - not_null

      - name: termination_date
        description: "Data de desligamento do colaborador (preenchida apenas em colaboradores inativos)."

      - name: is_active
        description: "Flag booleana indicando se o colaborador está ativo na folha de pagamento."
        tests:
          - not_null

      - name: primary_location_name
        description: "Nome descritivo da filial/unidade de trabalho do colaborador."

      - name: primary_location_type
        description: "Tipo de estabelecimento da filial (ex: store, warehouse)."

      - name: primary_location_city
        description: "Cidade da filial principal."

      - name: primary_location_state
        description: "Unidade Federativa / Estado (sigla) da filial principal."

      - name: primary_location_postal_code
        description: "Código postal / CEP da filial principal."

      - name: ingestion_timestamp
        description: "Data/hora mais recente de ingestão dos dados de origem para auditoria."
        tests:
          - not_null