version: 2

models:
  - name: fct_order_payments
    description: "Tabela fato contendo as transações financeiras de pagamento de pedidos não cancelados."
    columns:
      - name: payment_sk
        description: "Chave primária substituta (Surrogate Key) do pagamento."
        data_tests:
          - unique
          - not_null

      - name: date_sk
        description: "Chave estrangeira no formato numérico YYYYMMDD referente à data do pagamento."
        data_tests:
          - not_null

      - name: customer_sk
        description: "Chave estrangeira apontando para a dimensão de clientes (dim_customers)."

      - name: payment_id
        description: "Chave natural do pagamento no ERP."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Chave natural do pedido associado ao pagamento."
        data_tests:
          - not_null

      - name: customer_id
        description: "Chave natural do cliente associado ao pedido."

      - name: payment_method
        description: "Método de pagamento utilizado (ex: credit_card, boleto, pix)."
        data_tests:
          - not_null

      - name: payment_amount
        description: "Valor financeiro transacionado na forma de pagamento."
        data_tests:
          - not_null

      - name: paid_at
        description: "Data e hora em que o pagamento foi confirmado."

      - name: ingestion_timestamp
        description: "Timestamp de auditoria da carga do registro."
        data_tests:
          - not_null
      
      - name: is_payment_divergent
        description: "Flag que identifica divergência > R$ 1,00 entre o valor pago e o valor dos itens."