version: 2

models:
  - name: int_sku_supplier
    description: >
      Intermediate model that consolidates supplier-SKU relationships from `stg_lh_nautical_product_suppliers`.
      
      **Data Quality Rules Applied:**
      - Standardizes valid supplier SKUs into uppercase and removes leading/trailing spaces.
      - Normalizes non-standard values, placeholders, or invalid entries (e.g., `—`, `?`, `SEM-CODIGO`, `TBD`, `TODO`, `não informado`) to `NULL`.
      - **Expected Standard Pattern:** `SUP-XXX-XXXXX` (e.g., `SUP-018-00112`).
      
    columns:
      - name: product_variant_id
        description: "Natural key of the product variant (SKU granularity)."
        data_tests:
          - not_null

      - name: supplier_id
        description: "Supplier business key."
        data_tests:
          - not_null

      - name: supplier_sku
        description: >
          Supplier-specific SKU for the variant. 
          Expected standard format: `SUP-XXX-XXXXX` (e.g., `SUP-018-00112`).
          Invalid inputs, placeholders (`TODO`, `TBD`, `SEM-CODIGO`), symbols (`—`, `?`), or empty strings are normalized to `NULL`.

      - name: last_quoted_cost
        description: "Last quoted cost from the supplier. Useful for cost-based analytics."

      - name: lead_time_days
        description: "Supplier lead time in days."

      - name: is_preferred
        description: "Boolean flag indicating whether this supplier is the primary/preferred vendor for the variant."