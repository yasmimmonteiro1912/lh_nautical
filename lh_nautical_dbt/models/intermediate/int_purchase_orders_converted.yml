version: 2

models:
  - name: int_purchase_orders_converted
    description: "Trusted intermediate model that enriches purchase order headers with the applicable closing exchange rate factor based on the purchase date."
    columns:
      - name: purchase_order_id
        description: "Primary key identifying the unique purchase order."
        data_tests:
          - unique
          - not_null

      - name: po_number
        description: "The official purchase order identification number generated by the ERP."
        data_tests:
          - not_null

      - name: supplier_id
        description: "Foreign key linking to the supplier."
        data_tests:
          - not_null

      - name: buyer_id
        description: "Foreign key identifying the internal buyer employee."
        data_tests:
          - not_null

      - name: destination_location_id
        description: "Foreign key indicating the destination physical warehouse/store."
        data_tests:
          - not_null

      - name: purchase_order_status
        description: "The lifecycle state of the purchase order."
        data_tests:
          - not_null

      - name: purchase_currency
        description: "The original currency code utilized in the negotiation (BRL, USD, EUR)."
        data_tests:
          - not_null

      - name: placed_at
        description: "The official timestamp when the purchase order was issued."
        data_tests:
          - not_null

      - name: expected_delivery_at
        description: "The estimated date for arrival at the docks."

      - name: applied_exchange_rate
        description: "The calculated exchange rate multiplier factor. Defaults to 1.0000 for BRL orders."
        data_tests:
          - not_null

      - name: ingestion_timestamp
        description: "Historical execution baseline timestamp fetched from the bronze layer."
        data_tests:
          - not_null