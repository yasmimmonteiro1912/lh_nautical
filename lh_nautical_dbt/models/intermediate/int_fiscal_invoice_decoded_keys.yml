version: 2

models:
  - name: int_fiscal_invoice_decoded_keys
    description: "Trusted intermediate model that parses and decodes the Brazilian NF-e access keys from the storage paths."
    columns:
      - name: fiscal_invoice_id
        description: "Primary key linking to the staging invoice table."
        data_tests:
          - unique
          - not_null

      - name: nfe_access_key
        description: "The parsed 44-digit electronic invoice access key."
        data_tests:
          - not_null

      - name: emitter_state_code
        description: "The 2-digit state identifier of the issuing entity (e.g., '31' for MG, '32' for ES)."

      - name: emitter_cnpj
        description: "The 14-digit CNPJ of the business unit that emitted the invoice."

      - name: fiscal_document_number
        description: "The 9-digit sequential invoice number extracted from the access key."