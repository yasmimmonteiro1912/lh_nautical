version: 2

models:
  - name: int_orders_with_items
    description: "Modelo intermediario que consolida pedidos com contagem de itens e constroi flags padronizadas de status."
    columns:
      - name: order_id
        description: "Chave primaria do pedido (String/UUID)."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identificador do cliente (String)."
        tests:
          - not_null

      - name: location_id
        description: "Identificador do local/loja (String)."

      - name: order_number
        description: "Numero legivel do pedido."

      - name: order_status
        description: "Status do pedido padronizado em minusculas."

      - name: is_cancelled
        description: "Flag booleana indicando se o pedido foi cancelado."

      - name: is_completed
        description: "Flag booleana indicando se o pedido foi concluido/pago com sucesso."

      - name: order_total_amount
        description: "Valor total do pedido (Decimal)."

      - name: total_items_count
        description: "Quantidade total de itens distintos no pedido."

      - name: total_quantity
        description: "Soma da quantidade de todos os produtos do pedido."
        