version: 2

models:
  - name: int_orders_with_items
    description: "Modelo intermediário na granularidade de item do pedido (order_item_id), combinando o cabeçalho do pedido (status, cliente, vendedor, canal) com o detalhe de cada linha."
    columns:
      # --- Primary & Natural Keys ---
      - name: order_item_id
        description: "Chave primária natural da linha do item do pedido."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Identificador do pedido (cabeçalho)."
        data_tests:
          - not_null

      - name: product_variant_id
        description: "Identificador da variante do produto vendida."
        data_tests:
          - not_null

      - name: customer_id
        description: "Identificador do cliente no ERP."
        data_tests:
          - not_null

      - name: location_id
        description: "Identificador do local/filial da venda."
        data_tests:
          - not_null

      - name: employee_id
        description: "Identificador do vendedor responsável. Pode ser nulo para vendas online."

      - name: order_number
        description: "Número operacional/legível do pedido."

      # --- Status & Flags ---
      - name: order_status
        description: "Status do pedido padronizado em minúsculas."
        data_tests:
          - not_null

      - name: order_channel
        description: "Canal de vendas padronizado (ex: e-commerce, loja física)."

      - name: is_cancelled
        description: "Flag booleana indicando se o pedido foi cancelado."
        data_tests:
          - not_null

      - name: is_completed
        description: "Flag booleana indicando se o pedido foi concluído/pago com sucesso."
        data_tests:
          - not_null

      # --- Métricas do Item ---
      - name: quantity
        description: "Quantidade vendida deste item na linha do pedido."
        data_tests:
          - not_null

      - name: unit_price
        description: "Preço de venda unitário da variante."
        data_tests:
          - not_null

      - name: line_total
        description: "Valor faturado total da linha do item após descontos de linha."
        data_tests:
          - not_null

      # --- Datas & Auditoria ---
      - name: placed_at
        description: "Data e hora em que o pedido foi realizado."
        data_tests:
          - not_null

      - name: created_at
        description: "Timestamp de criação do registro no sistema de origem."

      - name: updated_at
        description: "Timestamp da última atualização do registro no sistema de origem."

      - name: ingestion_timestamp
        description: "Timestamp de auditoria da carga de dados na pipeline."
        data_tests:
          - not_null